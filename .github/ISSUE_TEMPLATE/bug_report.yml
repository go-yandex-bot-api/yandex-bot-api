name: Bug Report
description: Create a report to help us improve the library
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: go_version
    attributes:
      label: Go Version
      description: What version of Go are you using? (e.g., 1.23)
      placeholder: go version go1.23.0 windows/amd64
    validations:
      required: true
  - type: input
    id: lib_version
    attributes:
      label: yandex-bot-api Version
      description: What version of this library are you using? (e.g., v1.0.0 or commit hash)
      placeholder: v1.0.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Please provide a minimal code snippet or steps to reproduce the issue.
      render: go
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / Logs
      description: What actually happened? Paste any panic logs or errors here.
      render: sh
    validations:
      required: false
